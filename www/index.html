<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#283b5b">
<title>ADCC QS Register</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
 <nav class="tabs" aria-label="Main">
  <div class="brand" id="railBrand"></div>
  <button data-act="nav" data-v="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="nav" data-v="register"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>Register</button>
  <button class="add" data-act="add"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>
  <button data-act="nav" data-v="dpr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16M8 14h3M8 17h6"/></svg>DPR</button>
  <button data-act="nav" data-v="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Photos</button>
  <button data-act="nav" data-v="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg>Projects</button>
  <button class="gear" data-act="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
 </nav>
 <div class="content">
  <header class="appbar"><div id="barBrand"></div><button class="gearb" data-act="settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></header>
  <main id="main"></main>
 </div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<button class="aifab" data-act="ai" aria-label="AI assistant">✨<span>AI</span></button>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden><div class="gbox"><div class="gtile"><img src="logo.png" alt="ADCC"></div><div class="gname">AL ADEEB <span>QS Register</span></div><div class="gbar"><i></i></div><p id="gateMsg">Loading…</p></div></div>
<div class="login" id="login" hidden>
 <svg class="sky" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2">
  <path d="M0 400V300h60v-80h50v80h40V180h70v220M220 400V240h40v-60h60v220M320 400V120h30V80h40v40h30v280M420 400V260h80v140M500 400V160h50v-40h50v280M600 400V220h40v-90h70v270M710 400V280h60v120M770 400V140h40V90h30v50h40v260M880 400V230h70v170M950 400V180h40v-50h60v270M1050 400V260h50v-60h40v200M1140 400V300h60v100"/>
  <path class="crane" d="M640 130V40M600 40h160M640 40l60 30M700 40v24"/></g></svg>
 <form class="box" id="loginForm" novalidate>
  <div class="tile"><img src="logo.png" alt="Al Adeeb Building Contracting LLC"></div>
  <h1>QS Register</h1>
  <p id="loginSub">Log in with your username and password</p>
  <label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <label id="confirmWrap" hidden>Confirm password<input name="confirm" type="password" autocomplete="new-password"></label>
  <div class="err" id="loginErr" role="alert"></div>
  <button class="btn pri" type="submit" id="loginBtn">Log in</button>
  <button class="swap" type="button" id="swapBtn">New user? Create an account</button>
 </form>
</div>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
