name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null || true
      - name: Install packages
        run: npm ci
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Use fixed signing key (so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; fi
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ADCC-QS-Register.apk
      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ADCC-QS-Register-apk
          path: ADCC-QS-Register.apk
      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ADCC QS Register v1.0.${{ github.run_number }}
          body: Download ADCC-QS-Register.apk below and open it on your Android phone to install.
          files: ADCC-QS-Register.apk
